<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Controle de Finanças Pessoais</title>
<meta name="theme-color" content="#3B2416">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icone-180.png">
<link rel="icon" type="image/png" href="icone-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Finanças pessoais">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* === 1 ESTILOS === */
:root {
  --espresso: #3B2416; --mocha: #6F4E37; --caramelo: #C68B59; --latte: #E8D3B9;
  --creme: #F5EBDD; --espuma: #FBF6EF; --receita: #5B7A3A; --alerta: #B5543A;
  --texto-suave: #7A5C46; --linha: #E2CDB2; --raio: 12px;
  --fonte: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --fonte-titulo: 'Fraunces', Georgia, serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--creme); color: var(--espresso); font-family: var(--fonte); font-size: 15px; line-height: 1.45; }
body { min-height: 100vh; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
h1, h2, h3 { font-family: var(--fonte-titulo); font-weight: 600; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: 22px; } h2 { font-size: 18px; } h3 { font-size: 15px; font-family: var(--fonte); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
.ti { font-size: 20px; vertical-align: -3px; }

/* Botões e campos */
.btn { border: 1px solid var(--latte); background: var(--espuma); border-radius: 10px; padding: 9px 14px; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--caramelo); }
.btn-principal { background: var(--espresso); color: var(--espuma); border-color: var(--espresso); font-weight: 600; }
.btn-principal:hover { background: var(--mocha); }
.btn-perigo { color: var(--alerta); }
.btn-icone { border: none; background: none; padding: 6px; border-radius: 8px; color: var(--mocha); }
.btn-icone:hover { background: var(--latte); }
.campo { display: block; margin-top: 12px; }
.campo > span { display: block; font-size: 12px; color: var(--texto-suave); margin-bottom: 4px; }
.campo input, .campo select { width: 100%; background: var(--espuma); border: 1px solid #D9BFA0; border-radius: 10px; padding: 10px 12px; }
.campo input:focus, .campo select:focus { outline: 2px solid var(--caramelo); outline-offset: 0; }
.erro { color: var(--alerta); font-size: 13px; min-height: 18px; margin-top: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: none; background: var(--latte); color: var(--espresso); border-radius: 999px; padding: 6px 12px; font-size: 13px; display: inline-flex; align-items: center; gap: 4px; }
.chip.ativo { background: var(--mocha); color: var(--espuma); }
.chip .ti { font-size: 15px; vertical-align: 0; }
.cartao { background: var(--espuma); border-radius: var(--raio); padding: 14px; }
.vazio { text-align: center; color: var(--texto-suave); padding: 28px 12px; }
.suave { color: var(--texto-suave); font-size: 13px; }
.positivo { color: var(--receita); }
.negativo { color: var(--alerta); }

/* Login */
#tela-login { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
#tela-login .cartao { width: 100%; max-width: 360px; padding: 28px 22px; }
#tela-login .marca { text-align: center; margin-bottom: 8px; }
#tela-login .marca .ti { font-size: 40px; color: var(--mocha); }
#tela-login .btn-principal { width: 100%; justify-content: center; margin-top: 16px; padding: 12px; }

/* Cabeçalho e menu */
#cabecalho { position: sticky; top: 0; z-index: 20; background: var(--espresso); color: var(--espuma); display: flex; align-items: center; gap: 8px; padding: 10px 12px; }
#cabecalho .btn-icone { color: var(--espuma); }
#cabecalho .btn-icone:hover { background: var(--mocha); }
#olho { margin-left: auto; }
.linha-check { display: flex; gap: 8px; align-items: flex-start; margin-top: 12px; }
.linha-check input { width: auto; margin-top: 3px; }
.campo textarea { width: 100%; background: var(--espuma); border: 1px solid #D9BFA0; border-radius: 10px; padding: 10px 12px; font: inherit; resize: vertical; min-height: 64px; }
.previa-notif { margin-top: 12px; background: var(--espuma); border: 1px solid #D9BFA0; border-radius: 14px; padding: 10px 12px; display: flex; gap: 10px; }
.previa-notif img { width: 32px; height: 32px; border-radius: 8px; flex: none; }
.previa-notif strong { display: block; }
.previa-notif p { margin: 2px 0 0; white-space: pre-line; font-size: 14px; }
.frase-linha { display: flex; gap: 6px; align-items: flex-start; padding: 8px 0; border-top: 1px solid var(--latte); }
.frase-linha > span { flex: 1; min-width: 0; }
.lista-prontas { margin: 8px 0 0; padding-left: 18px; font-size: 14px; }
.lista-prontas li { margin: 4px 0; }
#lembrete-status { min-height: 1.2em; }
.num, .lim { white-space: nowrap; }
/* Ocultar valores: desfoca números e gráficos, mantém o layout. */
body.ocultar-valores .num, body.ocultar-valores #resumo-filtro, body.ocultar-valores #app canvas {
  filter: blur(7px); user-select: none; transition: filter .15s; }
body.ocultar-valores #app canvas { pointer-events: none; }
#cabecalho-titulo { font-family: var(--fonte-titulo); font-size: 18px; flex: 1; }
#menu { position: absolute; top: 100%; left: 0; right: 0; background: var(--espresso); padding: 6px 8px 12px; display: grid; gap: 2px; box-shadow: 0 8px 20px rgba(59,36,22,.25); }
#menu button { background: none; border: none; color: var(--espuma); text-align: left; padding: 11px 12px; border-radius: 8px; display: flex; gap: 10px; align-items: center; }
#menu button:hover, #menu button.ativo { background: var(--mocha); }
main { max-width: 980px; margin: 0 auto; padding: 14px 16px 110px; }
.tela { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; min-height: 40px; }
.colunas > * { min-width: 0; }
.barra-titulo { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }

/* Navegação de mês */
.nav-mes { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.nav-mes h1 { text-align: center; flex: 1; }
.resumo { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.resumo .cartao.livre { grid-column: 1 / -1; }
.destaque-hoje { border: 1px solid var(--caramelo); }
.resumo .cartao { padding: 10px 12px; }
.resumo .rotulo { font-size: 12px; color: var(--texto-suave); }
.resumo .valor { font-size: 17px; font-weight: 600; }
.barra { height: 8px; border-radius: 4px; background: var(--latte); overflow: hidden; margin-top: 4px; }
.barra > div { height: 100%; background: var(--caramelo); border-radius: 4px; }
.barra.atencao > div { background: #D08A3E; }
.barra.estourou > div { background: var(--alerta); }
.barra.receita > div, .barra.superou > div { background: var(--receita); }
.orcamento + .orcamento { margin-top: 10px; }
.orcamento .linha-topo { display: flex; justify-content: space-between; font-size: 13px; }

/* Lista de lançamentos */
.lista { background: var(--espuma); border-radius: var(--raio); }
.item { display: flex; align-items: center; gap: 10px; padding: 11px 12px; border-bottom: 1px solid var(--linha); }
.item:last-child { border-bottom: none; }
.item .icone-tag { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: var(--espuma); flex: none; }
.item .icone-tag .ti { font-size: 18px; vertical-align: 0; }
.item .meio { flex: 1; min-width: 0; }
.item .desc { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .det { font-size: 12px; color: var(--texto-suave); }
.item .valor { font-weight: 600; white-space: nowrap; }
.item .acoes { display: flex; }
.filtros { display: grid; gap: 8px; }
.filtros input, .filtros select { background: var(--espuma); border: 1px solid #D9BFA0; border-radius: 10px; padding: 8px 10px; width: 100%; }
.filtros .linha { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
.filtros select, .campo select { min-width: 0; max-width: 100%; text-overflow: ellipsis; }
.acoes-filtro { display: flex; gap: 8px; flex-wrap: wrap; }
.filtros-extra { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0 8px; }
.filtros-extra .campo { margin-top: 4px; }
#resumo-filtro { padding: 0 4px; }
#filtro-subtag { grid-column: 1 / -1; }

/* Botão flutuante */
#novo-lancamento { position: fixed; right: 16px; bottom: 20px; z-index: 15; border: none; background: var(--espresso); color: var(--espuma); border-radius: 999px; padding: 14px 20px; font-weight: 600; box-shadow: 0 6px 18px rgba(59,36,22,.35); display: flex; gap: 6px; align-items: center; }
#novo-lancamento:hover { background: var(--mocha); }

/* Janela (painel de baixo no celular, janela central no computador) */
#modal-fundo { position: fixed; inset: 0; z-index: 30; background: rgba(59,36,22,.45); display: flex; align-items: flex-end; justify-content: center; }
#modal { background: var(--creme); width: 100%; max-width: 520px; max-height: 92vh; overflow-y: auto; border-radius: 18px 18px 0 0; padding: 18px 16px 22px; }
#modal .topo { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
.valor-grande { font-size: 30px; font-weight: 600; text-align: center; background: none; border: none; width: 100%; padding: 8px 0; border-bottom: 2px solid var(--latte); }
.valor-grande:focus { outline: none; border-color: var(--caramelo); }
.aviso-credito { font-size: 12px; color: var(--mocha); margin-top: 6px; }
.rodape-modal { display: flex; gap: 8px; margin-top: 18px; }
.rodape-modal .btn-principal { flex: 1; justify-content: center; padding: 12px; }

/* Aviso rápido */
#aviso { position: fixed; left: 50%; transform: translateX(-50%); bottom: 90px; z-index: 40; background: var(--espresso); color: var(--espuma); padding: 10px 16px; border-radius: 10px; font-size: 14px; max-width: 90vw; }
#aviso.erro-aviso { background: var(--alerta); }

/* Grades de tags, metas, ano */
.grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.tag-linha { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--linha); }
.blocos { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: 12px; align-items: start; }
.bloco { display: block; background: var(--espuma); border-radius: var(--raio); padding: 12px 14px; border: 1px solid transparent; }
.bloco.arquivada { opacity: .55; }
.bloco-topo { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.bloco-topo .tag-nome { flex: 1; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
.bloco .tag-linha { padding: 8px 0; border-bottom: 1px solid var(--linha); }
.bloco .tag-linha:last-child { border-bottom: none; }
.bloco-subs { margin-top: 6px; }
.sub-linha { gap: 8px; padding: 6px 0 6px 12px !important; }
.sub-linha .bolinha { width: 22px; height: 22px; }
.sub-linha .btn-icone { padding: 4px; }
.bloco-nova-sub { margin-top: 8px; }
.parc-linha { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
.parc-linha > span { flex: 0 0 90px; font-size: 13px; color: var(--texto-suave); }
.parc-linha input { flex: 1; min-width: 0; text-align: right; background: var(--espuma); border: 1px solid #D9BFA0; border-radius: 10px; padding: 8px 10px; }
.btn-mini { padding: 4px 10px; font-size: 13px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.orc-linha { padding: 10px 0; border-bottom: 1px solid var(--linha); }
.orc-linha:last-child { border-bottom: none; }
.orc-topo { display: flex; align-items: center; gap: 8px; }
.orc-nome { flex: 1; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.orc-campo { flex: 0 0 120px; }
.orc-limite { width: 100%; text-align: right; background: var(--creme); border: 1px solid #D9BFA0; border-radius: 8px; padding: 6px 8px; }
.orc-limite:focus { outline: 2px solid var(--caramelo); }
.barra-empilhada { display: flex; height: 16px; border-radius: 8px; overflow: hidden; background: var(--latte); margin-top: 8px; }
.barra-empilhada > div { height: 100%; }
#orc-encaixe.encaixa { border: 1px solid #B9CFA0; }
#orc-encaixe.nao-encaixa { border: 1px solid var(--alerta); }
#orc-encaixe.nao-encaixa p:first-of-type { color: var(--alerta); font-weight: 600; }
.nota-extra { margin-top: 4px; }
.tag-linha.arquivada { opacity: .55; }
.bolinha { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; color: var(--espuma); flex: none; }
.bolinha .ti { font-size: 15px; vertical-align: 0; }
.paleta { display: flex; flex-wrap: wrap; gap: 6px; }
.paleta button { width: 28px; height: 28px; border-radius: 50%; border: 2px solid transparent; }
.paleta button.ativo { border-color: var(--espresso); }
.icones { display: grid; grid-template-columns: repeat(auto-fill, minmax(38px, 1fr)); gap: 4px; }
.icones button { border: 1px solid transparent; background: var(--espuma); border-radius: 8px; padding: 6px 0; }
.icones button.ativo { border-color: var(--mocha); background: var(--latte); }
.mes-ano { cursor: pointer; border: 1px solid transparent; }
.mes-ano:hover { border-color: var(--caramelo); }
.grafico { position: relative; height: 260px; }
.filtros-graf { margin-top: 8px; }
.filtros-graf select.chip { border: 1px solid var(--latte); padding: 5px 8px; }
.destaque { font-size: 26px; font-weight: 600; font-family: var(--fonte-titulo); }

@media (min-width: 760px) {
  .resumo { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
  .resumo .cartao.livre { grid-column: auto; }
  #modal-fundo { align-items: center; }
  #modal { border-radius: 18px; }
  .colunas { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 14px; align-items: start; }
  .filtros .linha { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  #filtro-subtag { grid-column: auto; }
}
/* === FIM 1 === */
</style>
</head>
<body>
<!-- === 2 ESTRUTURA === -->
<section id="tela-login" hidden>
  <form class="cartao" id="login-form" novalidate>
    <div class="marca"><i class="ti ti-wallet"></i><h1>Controle de Finanças Pessoais</h1><p class="suave">Entre com a sua conta</p></div>
    <label class="campo"><span>E-mail</span><input id="login-email" type="email" autocomplete="username" placeholder="voce@email.com"></label>
    <label class="campo"><span>Senha</span><input id="login-senha" type="password" autocomplete="current-password"></label>

<div id="app" hidden>
  <header id="cabecalho">
    <button class="btn-icone" id="menu-botao" aria-label="Abrir menu" aria-expanded="false"><i class="ti ti-menu-2"></i></button>
    <span id="cabecalho-titulo">Controle de Finanças Pessoais</span>
    <button class="btn-icone" id="olho" aria-label="Ocultar valores" aria-pressed="false" title="Ocultar valores"><i class="ti ti-eye"></i></button>

    <nav id="menu" hidden>
      <button data-tela="mes"><i class="ti ti-calendar-month"></i>Mês</button>
      <button data-tela="orcamento"><i class="ti ti-report-money"></i>Orçamento</button>
      <button data-tela="dashboards"><i class="ti ti-chart-bar"></i>Dashboards</button>
      <button data-tela="ano"><i class="ti ti-calendar"></i>Ano</button>
      <button data-tela="metas"><i class="ti ti-target-arrow"></i>Metas</button>

<div id="modal-fundo" hidden><div id="modal" role="dialog" aria-modal="true"></div></div>
<div id="aviso" hidden role="status"></div>

<script>
/* === 3 ARMAZENAMENTO === */
// Única parte do app que conversa com o banco. Para trocar de banco, troque só esta seção.
// A publishable key pode ficar aqui: quem protege os dados é o login + RLS no Supabase.
// NUNCA coloque aqui a secret key nem a senha do banco.
const SUPABASE_URL = 'https://qtgkpnejimlrkjdhrqfh.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_1c18DqMugLVQfl9tK9krCA_5v0DgExJ';

function traduzErro(error) {
  const msg = String((error && error.message) || error || '');
  if (/Invalid login credentials/i.test(msg)) return 'E-mail ou senha incorretos.';
  if (/Email not confirmed/i.test(msg)) return 'Este e-mail ainda não foi confirmado no Supabase.';
  if (/extraordinario_cents/i.test(msg)) return 'O banco ainda não aceita extraordinário parcial. No Supabase, rode o arquivo migracao-004-extraordinario-parcial.sql no SQL Editor.';
  if (/extraordinario/i.test(msg)) return 'O banco ainda não tem a opção de gasto extraordinário. No Supabase, rode o arquivo migracao-003-extraordinario-excluir-tags.sql no SQL Editor.';
  if (/kind_check/i.test(msg)) return 'O banco ainda não aceita doações. No Supabase, rode o arquivo migracao-002-doacoes.sql no SQL Editor.';
  if (/(lembrete_config|push_inscricoes|frases|registrar_inscricao)/i.test(msg) && /schema cache|does not exist|Could not find/i.test(msg))
    return 'O banco ainda não tem o lembrete diário. No Supabase, rode o arquivo migracao-006-lembrete-diario.sql no SQL Editor.';
  if (/permission denied for table tags/i.test(msg)) return 'O banco ainda não permite excluir tags. No Supabase, rode o arquivo migracao-003-extraordinario-excluir-tags.sql no SQL Editor.';
  if (/row-level security|permission denied/i.test(msg)) return 'Você só pode alterar os seus próprios dados.';
  if (/Failed to fetch|NetworkError|network/i.test(msg)) return 'Sem conexão com o banco. Verifique a internet e tente de novo.';
  if (/JWT|session|expired/i.test(msg)) return 'Sua sessão expirou. Entre de novo.';
  return 'Algo deu errado: ' + msg;
}

function createStore(client) {
  let user = null;
  const check = ({ data, error }) => { if (error) throw new Error(traduzErro(error)); return data; };

  return {
    async signIn(email, password) {
      const data = check(await client.auth.signInWithPassword({ email, password }));
      user = data.user;
      return user;
    },
    async signOut() { await client.auth.signOut(); user = null; },
    async restoreSession() {
      const { data } = await client.auth.getSession();
      user = (data && data.session && data.session.user) || null;
      return user;
    },
    currentUser() { return user; },
    onAuthChange(cb) {
      client.auth.onAuthStateChange((_event, session) => { user = (session && session.user) || null; cb(user); });
    },

    // O Supabase devolve no máximo 1000 linhas por vez; aqui buscamos página por página.
    async list(table, filtros = {}) {
      const PAGE = 1000;
      const all = [];
      for (let from = 0; ; from += PAGE) {
        let q = client.from(table).select('*');
        if (filtros.competence_from) q = q.gte('competence_date', filtros.competence_from);
        if (filtros.competence_to) q = q.lte('competence_date', filtros.competence_to);
        if (filtros.owner_id) q = q.eq('owner_id', filtros.owner_id);
        q = q.order('id').range(from, from + PAGE - 1);
        const page = check(await q) || [];
        all.push(...page);
        if (page.length < PAGE) return all;
      }
    },
    async insert(table, rows) {
      const list = Array.isArray(rows) ? rows : [rows];
      return check(await client.from(table).insert(list).select()) || [];
    },
    async update(table, id, campos) {
      const data = check(await client.from(table).update(campos).eq('id', id).select());
      // Com RLS, editar algo que não é seu não dá erro: simplesmente não altera nada.

function isoFromUTC(y, m0, d) {

}
function parts(iso) {

}
function daysInMonth(y, m0) { return new Date(Date.UTC(y, m0 + 1, 0)).getUTCDate(); }
function addMonths(monthISO, n) { const p = parts(monthISO); return isoFromUTC(p.y, p.m0 + n, 1); }
function monthStart(iso) { return iso.slice(0, 7) + '-01'; }
function monthEnd(iso) { const p = parts(iso); return isoFromUTC(p.y, p.m0, daysInMonth(p.y, p.m0)); }

  return isoFromUTC(d.getFullYear(), d.getMonth(), d.getDate());
}

// Crédito conta no dia 10 do mês seguinte à compra; o resto conta na própria data.
function competenceDate(purchaseISO, payment) {
  if (payment !== 'credito') return purchaseISO;
  const p = parts(purchaseISO);
  return isoFromUTC(p.y, p.m0 + 1, 10);

// Soma n meses mantendo o dia (31/01 + 1 mês = 28/02).
function addMonthsDay(iso, n) {
  const p = parts(iso);
  const alvo = new Date(Date.UTC(p.y, p.m0 + n, 1));
  const y = alvo.getUTCFullYear(), m0 = alvo.getUTCMonth();
  return isoFromUTC(y, m0, Math.min(p.d, daysInMonth(y, m0)));
}

// Divide uma compra no crédito em n parcelas; os centavos que sobram vão na 1ª.
// primeiraFatura: data em que a 1ª parcela cai no cartão (padrão: dia 10 do mês seguinte).
// valores (opcional): valor de cada parcela em centavos, quando a pessoa escolhe um por um.
function splitInstallments(totalCents, n, purchaseISO, primeiraFatura, valores) {
  const base = Math.trunc(totalCents / n);
  const rest = totalCents - base * n;
  const primeira = primeiraFatura || competenceDate(purchaseISO, 'credito');
  const out = [];
  for (let k = 1; k <= n; k++) {
    out.push({
      amount_cents: valores ? valores[k - 1] : base + (k === 1 ? rest : 0),
      competence_date: addMonthsDay(primeira, k - 1),
      installment_n: k,
      installment_total: n,
    });
  }
  return out;
}

function recurrencePurchaseDate(rec, monthISO) {

// Lançamentos de recorrentes que ainda faltam criar para o mês aberto (por competência).

function pendingRecurrences(recs, existingTxs, monthISO, ateMes) {
  const month = monthStart(monthISO);
  const out = [];
  for (const r of recs) {
    if (r.paused) continue;
    const purchaseMonth = r.payment === 'credito' ? addMonths(month, -1) : month;
    if (ateMes && purchaseMonth > monthStart(ateMes)) continue;
    if (purchaseMonth < monthStart(r.start_month)) continue;
    if (r.end_month && purchaseMonth > monthStart(r.end_month)) continue;
    const purchase = recurrencePurchaseDate(r, purchaseMonth);
    const competence = competenceDate(purchase, r.payment);
    // Já lançado neste mês (mesmo que alguém tenha editado o dia): não cria de novo.
    if (existingTxs.some((t) => t.recurrence_id === r.id && monthStart(t.competence_date) === month)) continue;
    out.push({
      owner_id: r.owner_id, kind: r.kind, amount_cents: r.amount_cents, description: r.description,
      tag_id: r.tag_id, payment: r.payment, purchase_date: purchase, competence_date: competence,

}

function subtagsDe(maeId, incluir = []) {
  return state.tags.filter((t) => t.parent_id === maeId && (!t.archived || incluir.includes(t.id)))
    .sort((a, b) => a.name.localeCompare(b.name, 'pt-BR'));
}
const NOVA = '__nova__';
function opcoesTagsHTML(mae) {
  return `<option value="">Sem tag</option>` +
    tagsPrincipais([mae]).map((t) => `<option value="${t.id}" ${t.id === mae ? 'selected' : ''}>${esc(t.name)}</option>`).join('') +
    `<option value="${NOVA}">+ Nova tag…</option>`;
}
function seletorTagHTML(p, selecionada) {
  const sel = tagPorId(selecionada);
  const mae = sel ? (sel.parent_id || sel.id) : '';
  return `<label class="campo"><span>Tag</span><select id="${p}-tag">${opcoesTagsHTML(mae)}</select></label>
    <label class="campo" id="campo-${p}-subtag" hidden><span>Subtag</span><select id="${p}-subtag"></select></label>`;
}
// Seletor de tag em dois passos. "+ Nova tag…" e "+ Nova subtag…" criam ali mesmo, sem sair do formulário.
function ligarSeletorTag(m, p, selecionada) {
  const sel = tagPorId(selecionada);
  let escolhida = sel && sel.parent_id ? sel.id : '';
  let maeAtual = sel ? (sel.parent_id || sel.id) : '';
  const campoTag = $(`#${p}-tag`, m), campoSub = $(`#${p}-subtag`, m);
  const preencher = () => {
    const mae = campoTag.value;
    const subs = mae ? subtagsDe(mae, [escolhida]) : [];
    $(`#campo-${p}-subtag`, m).hidden = !mae;
    campoSub.innerHTML = `<option value="">Sem subtag</option>` +
      subs.map((t) => `<option value="${t.id}" ${t.id === escolhida ? 'selected' : ''}>${esc(t.name)}</option>`).join('') +
      `<option value="${NOVA}">+ Nova subtag…</option>`;
  };
  const usar = (mae, sub) => {
    maeAtual = mae; escolhida = sub;
    campoTag.innerHTML = opcoesTagsHTML(mae);
    campoTag.value = mae;
    preencher();
  };
  campoTag.addEventListener('input', () => {
    if (campoTag.value === NOVA) {
      campoTag.value = maeAtual;
      abrirNovaTagInline(m, null, (nova) => usar(nova.id, ''));
      return;
    }
    maeAtual = campoTag.value; escolhida = ''; preencher();
  });
  campoSub.addEventListener('input', () => {
    if (campoSub.value === NOVA) {
      campoSub.value = escolhida;
      abrirNovaTagInline(m, maeAtual, (nova) => usar(nova.parent_id, nova.id));
      return;
    }
    escolhida = campoSub.value;
  });
  preencher();
}

// Mini formulário de tag/subtag dentro do formulário aberto (mesmas cores e ícones da aba Tags).
// O que já foi digitado fica guardado: o formulário só é escondido enquanto o painel está aberto.
function abrirNovaTagInline(m, maeId, aoCriar) {
  const ehSub = maeId !== null;
  const f = { cor: ehSub ? '#D4A373' : '#C68B59', icone: 'tag' };
  const outros = [...m.children].map((c) => [c, c.hidden]);
  outros.forEach(([c]) => { c.hidden = true; });
  const painel = document.createElement('div');
  painel.id = 'nova-tag-inline';
  painel.innerHTML = `<div class="topo"><h2>${ehSub ? 'Nova subtag' : 'Nova tag'}</h2></div>
    <label class="campo"><span>Nome</span><input id="nt-nome" placeholder="${ehSub ? 'Mercado' : 'Alimentação'}"></label>
    ${ehSub ? `<label class="campo"><span>Pertence à tag</span><select id="nt-tag">${tagsPrincipais([maeId]).map((t) =>
      `<option value="${t.id}" ${t.id === maeId ? 'selected' : ''}>${esc(t.name)}</option>`).join('')}</select></label>` : ''}
    ${camposCorIcone(f)}
    <div class="erro" id="nt-erro" role="alert"></div>
    <div class="rodape-modal"><button class="btn" id="nt-cancelar">Voltar</button>
      <button class="btn btn-principal" id="nt-salvar">Criar e usar</button></div>`;
  m.appendChild(painel);
  ligarCorIcone(painel, f);
  m.scrollTop = 0;
  $('#nt-nome', painel).focus();
  const fechar = () => { painel.remove(); outros.forEach(([c, h]) => { c.hidden = h; }); };
  $('#nt-cancelar', painel).addEventListener('click', fechar);
  $('#nt-salvar', painel).addEventListener('click', async () => {
    const nome = $('#nt-nome', painel).value.trim();
    if (!nome) { $('#nt-erro', painel).textContent = `Dê um nome para a ${ehSub ? 'subtag' : 'tag'}.`; return; }
    const campos = { name: nome, color: f.cor, icon: f.icone, parent_id: ehSub ? $('#nt-tag', painel).value : null };
    const nova = await tentar(async () => (await store.insert('tags', campos))[0]);
    if (!nova) return;
    state.tags.push(nova);
    fechar();
    aoCriar(nova);
    avisar(ehSub ? 'Subtag criada' : 'Tag criada');
  });
}
function valorTag(m, p) { return $(`#${p}-subtag`, m).value || $(`#${p}-tag`, m).value || null; }

// Cria, ao abrir o mês, os lançamentos dos meus recorrentes que ainda faltam.
async function gerarRecorrentes(meusDoMes) {
  const recs = await store.list('recurrences', { owner_id: state.user.id });
  const novos = pendingRecurrences(recs, meusDoMes, mesISO(), monthStart(todayISO()));
  for (const n of novos) {
    try { meusDoMes.push(...await store.insert('transactions', n)); }
    catch (e) { if (!/duplicate/i.test(e.message)) throw e; } // já criado em outro aparelho
  }
}

function desenharListaMes() {
  const busca = ($('#busca-mes').value || '').trim().toLowerCase();
  const tag = $('#filtro-tag').value, sub = $('#filtro-subtag').value, pag = $('#filtro-pag').value;
  const de = $('#filtro-de').value, ate = $('#filtro-ate').value;
  const min = $('#filtro-min').value ? parseBRL($('#filtro-min').value) : null;
  const max = $('#filtro-max').value ? parseBRL($('#filtro-max').value) : null;
  const ordem = $('#ordem-mes').value;
  // Ordem: por data da compra (desempate pela data em que conta) ou pelo valor.
  const porData = (a, b) => a.purchase_date.localeCompare(b.purchase_date) || a.competence_date.localeCompare(b.competence_date) ||
    String(a.created_at || '').localeCompare(String(b.created_at || ''));
  const porValor = (a, b) => Math.abs(a.amount_cents) - Math.abs(b.amount_cents);
  const comparar = { recente: (a, b) => porData(b, a), antiga: porData, maior: (a, b) => porValor(b, a), menor: porValor }[ordem] || ((a, b) => porData(b, a));
  const itens = mesDados.txs
    .filter((t) => !busca || (t.description || '').toLowerCase().includes(busca) || tagNome(t.tag_id).toLowerCase().includes(busca))
    .filter((t) => !tag || rootTagId(t.tag_id, state.tags) === tag)
    .filter((t) => !sub || t.tag_id === sub)
    .filter((t) => !pag || t.payment === pag)
    .filter((t) => (!de || t.purchase_date >= de) && (!ate || t.purchase_date <= ate))
    .filter((t) => (min === null || Math.abs(t.amount_cents) >= min) && (max === null || Math.abs(t.amount_cents) <= max))
    .sort(comparar);
  // Resumo do que está na lista (respeita todos os filtros).
  const saiu = itens.filter((t) => t.kind !== 'receita').reduce((s, t) => s + t.amount_cents, 0);
  const entrou = itens.filter((t) => t.kind === 'receita').reduce((s, t) => s + t.amount_cents, 0);
  $('#resumo-filtro').textContent = itens.length
    ? [`${itens.length} ${itens.length === 1 ? 'lançamento' : 'lançamentos'}`, `Saiu ${formatBRL(saiu)}`].concat(entrou ? [`Entrou ${formatBRL(entrou)}`] : []).join(' · ')
    : '';
  const lista = $('#lista-mes');
  if (!itens.length) {
    lista.innerHTML = mesDados.txs.length
      ? '<div class="vazio">Nada encontrado com esses filtros.</div>'
      : '<div class="vazio"><i class="ti ti-wallet"></i><br>Nenhum lançamento neste mês.<br>Toque em “Novo lançamento” para começar.</div>';
    return;
  }
  lista.innerHTML = itens.map(itemHTML).join('');
  $$('.item .editar', lista).forEach((b) => b.addEventListener('click', () => {
    const tx = mesDados.txs.find((t) => t.id === b.closest('.item').dataset.id); abrirLancamento(tx);
  }));
  $$('.item .excluir', lista).forEach((b) => b.addEventListener('click', () => {
    const tx = mesDados.txs.find((t) => t.id === b.closest('.item').dataset.id); confirmarExclusao(tx);
  }));
}

function itemHTML(t) {
  const meu = t.owner_id === state.user.id;
  const v = tagVisual(t.tag_id);
  const icone = t.kind === 'receita' ? 'arrow-down-left' : t.kind === 'investimento' ? 'trending-up'
    : t.kind === 'doacao' && !t.tag_id ? 'heart-handshake' : v.icone;
  const cor = t.kind === 'receita' ? 'var(--receita)' : t.kind === 'investimento' ? 'var(--mocha)'
    : t.kind === 'doacao' && !t.tag_id ? '#9C6644' : v.cor;
  const det = [formatDateBR(t.competence_date).slice(0, 5)];
  if (t.kind === 'gasto') det.push(esc(tagNome(t.tag_id)));
  else det.push(t.tag_id ? `${TIPOS[t.kind]} · ${esc(tagNome(t.tag_id))}` : TIPOS[t.kind]);
  if (t.payment) det.push(PAGAMENTOS[t.payment]);
  if (t.extraordinario) {
    det.push(valorExtra(t) < t.amount_cents ? `<strong>Extraordinário: ${num(valorExtra(t))}</strong>` : '<strong>Extraordinário</strong>');
  }
  if (t.installment_total > 1) det.push(`parcela ${t.installment_n}/${t.installment_total}`);
  if (t.payment === 'credito' && t.purchase_date !== t.competence_date) det.push(`compra ${formatDateBR(t.purchase_date).slice(0, 5)}`);
  const sinal = t.kind === 'receita' ? 'positivo' : '';
  return `<div class="item" data-id="${t.id}">
    <div class="icone-tag" style="background:${esc(cor)}"><i class="ti ti-${esc(icone)}"></i></div>
    <div class="meio"><div class="desc">${esc(t.description || TIPOS[t.kind])}${t.recurrence_id ? ' <i class="ti ti-repeat suave" title="Recorrente"></i>' : ''}</div>
      <div class="det">${det.join(' · ')}</div></div>
    <div class="valor ${sinal}">${num(t.amount_cents)}</div>
    ${meu ? `<div class="acoes"><button class="btn-icone editar" aria-label="Editar"><i class="ti ti-pencil"></i></button>
      <button class="btn-icone excluir" aria-label="Excluir"><i class="ti ti-trash"></i></button></div>` : ''}
  </div>`;
}

      <input type="checkbox" id="lanc-extra" style="width:auto; margin-top:3px" ${tx && tx.extraordinario ? 'checked' : ''}>
      <span style="margin:0">Gasto extraordinário<br><span class="suave">Planejado para ficar fora do orçamento (ex.: cirurgia, viagem). Conta no que saiu, mas não estoura a barra da tag.</span></span></label>
    <label class="campo" id="campo-extra-valor" hidden><span>Quanto disso é extraordinário (o resto conta no orçamento)</span>
      <input id="lanc-extra-valor" data-moeda inputmode="numeric" value="${tx && tx.extraordinario ? mascaraDigitos(String(valorExtra(tx))) : ''}"></label>
    <label class="campo" id="campo-estorno" style="display:flex; gap:8px; align-items:center">
      <input type="checkbox" id="lanc-estorno" style="width:auto" ${tx && tx.amount_cents < 0 ? 'checked' : ''}><span style="margin:0">É um estorno (devolução)</span></label>
    <div class="aviso-credito" id="lanc-aviso"></div>
    <div class="erro" id="lanc-erro" role="alert"></div>
    <div class="rodape-modal"><button class="btn" id="lanc-cancelar">Cancelar</button>
      <button class="btn btn-principal" id="lanc-salvar">Salvar</button></div>`, (m) => {
    // A data da fatura segue a regra (dia 10 do mês seguinte) até a pessoa escolher outra.
    let faturaManual = false;
    const faturaPadrao = (data) => {
      const primeira = competenceDate(data, 'credito');
      return grupo ? addMonthsDay(primeira, tx.installment_n - 1) : primeira;
    };
    // Valor de cada parcela: dividido igual até a pessoa mexer em alguma.
    let parcManual = false, valoresParc = [];
    const desenharParcelas = () => {
      const credito = COM_PAGAMENTO(f.tipo) && f.pag === 'credito' && !$('#lanc-estorno', m).checked;
      const n = Number($('#lanc-parcelas', m).value || 1);
      const campo = $('#campo-parc-valores', m);
      campo.hidden = editando || !credito || n <= 1;
      if (campo.hidden) return;
      if (!parcManual || valoresParc.length !== n) {
        valoresParc = splitInstallments(parseBRL($('#lanc-valor', m).value) || 0, n, $('#lanc-data', m).value || todayISO()).map((x) => x.amount_cents);
        parcManual = false;
      }
      const primeira = $('#lanc-fatura', m).value || competenceDate($('#lanc-data', m).value || todayISO(), 'credito');
      const lista = $('#lanc-parcelas-lista', m);
      lista.innerHTML = valoresParc.map((v, i) => `<label class="parc-linha"><span>${i + 1}ª · ${formatDateBR(addMonthsDay(primeira, i)).slice(0, 5)}</span>
        <input class="parc-valor" data-moeda inputmode="numeric" aria-label="Valor da parcela ${i + 1}" value="${v ? mascaraDigitos(String(v)) : ''}"></label>`).join('');
      ligarMascaras(lista);
      const somar = () => {
        const total = valoresParc.reduce((a, b) => a + (b || 0), 0);
        $('#lanc-parc-total', m).textContent = `Total: ${formatBRL(total)}`;
        return total;
      };
      $$('.parc-valor', lista).forEach((inp, i) => inp.addEventListener('input', () => {
        parcManual = true;
        valoresParc[i] = parseBRL(inp.value) || 0;
        $('#lanc-valor', m).value = mascaraDigitos(String(somar()));
      }));
      somar();
    };
    // Usado ao salvar: valores de cada parcela, ou null quando a lista não está na tela.
    m.lerParcelas = () => ($('#campo-parc-valores', m).hidden ? null : $$('.parc-valor', m).map((x) => parseBRL(x.value)));
    const atualizar = () => {
      const gasto = COM_PAGAMENTO(f.tipo);
      const credito = gasto && f.pag === 'credito';
      $('#campo-pag', m).hidden = !gasto;
      $('#campo-estorno', m).hidden = f.tipo !== 'gasto';
      $('#campo-extra', m).hidden = f.tipo !== 'gasto';
      $('#campo-extra-valor', m).hidden = f.tipo !== 'gasto' || !$('#lanc-extra', m).checked;
      $('#campo-parcelas', m).hidden = editando || !credito;
      $('#campo-fatura', m).hidden = !credito;
      $$('[data-tipo]', m).forEach((b) => b.classList.toggle('ativo', b.dataset.tipo === f.tipo));
      $$('[data-pag]', m).forEach((b) => b.classList.toggle('ativo', b.dataset.pag === f.pag));
      const data = $('#lanc-data', m).value;
      const campoFatura = $('#lanc-fatura', m);
      if (credito && data && (!faturaManual && (!campoFatura.dataset.inicial || campoFatura.dataset.mexeu))) campoFatura.value = faturaPadrao(data);
      if (credito && !campoFatura.value && data) campoFatura.value = faturaPadrao(data);
      const aviso = $('#lanc-aviso', m);
      if (credito && campoFatura.value) {
        const n = Number(($('#lanc-parcelas', m) || {}).value || 1);
        const comp = formatDateBR(campoFatura.value).slice(0, 5);
        aviso.textContent = editando || n === 1 ? `Entra em ${comp} (fatura do cartão).` : `Entra em ${comp} · ${n} parcelas, uma por mês.`;
      } else aviso.textContent = '';
      desenharParcelas();
    };
    // Na edição, o valor salvo vale até a pessoa mudar a data da compra.
    if ($('#lanc-fatura', m).value) $('#lanc-fatura', m).dataset.inicial = '1';
    $('#lanc-data', m).addEventListener('input', () => { $('#lanc-fatura', m).dataset.mexeu = '1'; });
    $('#lanc-fatura', m).addEventListener('input', () => { faturaManual = true; atualizar(); });
    ligarSeletorTag(m, 'lanc', tx ? tx.tag_id : '');
    $$('[data-tipo]', m).forEach((b) => b.addEventListener('click', () => { f.tipo = b.dataset.tipo; atualizar(); }));
    $$('[data-pag]', m).forEach((b) => b.addEventListener('click', () => { f.pag = b.dataset.pag; atualizar(); }));
    for (const id of ['#lanc-data', '#lanc-parcelas']) $(id, m).addEventListener('input', atualizar);
    $('#lanc-estorno', m).addEventListener('change', atualizar);
    // A parte extraordinária acompanha o total até a pessoa mexer nela.
    let extraManual = !!(tx && tx.extraordinario);
    const sugerirExtra = () => { if (!extraManual) $('#lanc-extra-valor', m).value = $('#lanc-valor', m).value; };
    $('#lanc-extra', m).addEventListener('change', () => { sugerirExtra(); atualizar(); });
    $('#lanc-extra-valor', m).addEventListener('input', () => { extraManual = true; });
    $('#lanc-valor', m).addEventListener('input', sugerirExtra);
    // Mudar o total volta a dividir igual.
    $('#lanc-valor', m).addEventListener('input', () => { parcManual = false; desenharParcelas(); });
    $('#lanc-fechar', m).addEventListener('click', fecharModal);
    $('#lanc-cancelar', m).addEventListener('click', fecharModal);
    $('#lanc-salvar', m).addEventListener('click', () => salvarLancamento(tx, f));
    $('#lanc-valor', m).addEventListener('keydown', (ev) => { if (ev.key === 'Enter') salvarLancamento(tx, f); });
    atualizar();
  });
}

async function salvarLancamento(tx, f) {
  const erro = $('#lanc-erro');
  const valor = parseBRL($('#lanc-valor').value);
  const data = $('#lanc-data').value;
  if (!valor || valor <= 0) { erro.textContent = 'Informe um valor maior que zero, como 48,90.'; return; }
  if (!data) { erro.textContent = 'Informe a data.'; return; }
  const gasto = COM_PAGAMENTO(f.tipo);
  const payment = gasto ? f.pag : null;
  const estorno = f.tipo === 'gasto' && $('#lanc-estorno').checked;
  const fatura = payment === 'credito' ? $('#lanc-fatura').value : null;
  if (payment === 'credito' && !fatura) { erro.textContent = 'Informe quando cai na fatura do cartão.'; return; }
  if (fatura && fatura < data) { erro.textContent = 'A data da fatura não pode ser antes da compra.'; return; }
  const competencia = fatura || data;
  const parcelasEscolhidas = !tx && $('#modal').lerParcelas ? $('#modal').lerParcelas() : null;
  if (parcelasEscolhidas && parcelasEscolhidas.some((v) => !v || v <= 0)) {
    erro.textContent = 'Informe o valor de todas as parcelas.'; return;
  }
  const campos = {
    kind: f.tipo, description: $('#lanc-desc').value.trim(),
    tag_id: valorTag(document, 'lanc'), payment,
  };
  // Só envia o campo quando há algo a dizer: assim o app funciona mesmo antes da migração 003.
  const extra = f.tipo === 'gasto' && $('#lanc-extra').checked;
  if (extra || (tx && tx.extraordinario !== undefined)) campos.extraordinario = extra;
  // Parte extraordinária: vazio = o valor inteiro. Só manda a coluna quando precisa (funciona antes da migração 004).
  const extraValor = extra ? parseBRL($('#lanc-extra-valor').value) : 0;
  if (extra && (!extraValor || extraValor <= 0)) { erro.textContent = 'Informe quanto do valor é extraordinário.'; return; }
  if (extra && extraValor > valor) { erro.textContent = 'A parte extraordinária não pode ser maior que o valor do lançamento.'; return; }
  const parcial = extra && extraValor < valor;
  const temColuna = !!(tx && tx.extraordinario_cents !== undefined);
  const extraCentsDe = (amount) => (parcial ? Math.round((amount * extraValor) / valor) : null);
  if (parcial || temColuna) campos.extraordinario_cents = extraCentsDe(valor);
  const extraCampo = 'extraordinario' in campos ? { extraordinario: campos.extraordinario } : {};
  const btn = $('#lanc-salvar');
  btn.disabled = true;
  const ok = await tentar(async () => {
    if (!tx) {
      const n = gasto && payment === 'credito' && !estorno ? Number($('#lanc-parcelas').value) : 1;
      if (n > 1) {
        const group = novoId();
        const valores = $('#modal').lerParcelas();
        const parcelas = splitInstallments(valor, n, data, fatura, valores);
        const extras = parcial ? dividirExtra(parcelas.map((p) => p.amount_cents), extraValor) : null;
        await store.insert('transactions', parcelas.map((p, i) => ({
          ...campos, ...p, purchase_date: data, installment_group: group,
          ...(extras ? { extraordinario_cents: extras[i] } : {}) })));
      } else {
        await store.insert('transactions', { ...campos, amount_cents: estorno ? -valor : valor,
          purchase_date: data, competence_date: competencia });
      }
    } else if (tx.installment_group && tx.installment_total > 1) {
      const escopo = $('#lanc-escopo').value;
      const mudouValor = valor !== Math.abs(tx.amount_cents);
      if (escopo === 'so-esta') {
        await store.update('transactions', tx.id, { description: campos.description, tag_id: campos.tag_id, ...extraCampo,
          ...('extraordinario_cents' in campos ? { extraordinario_cents: campos.extraordinario_cents } : {}),
          amount_cents: estorno ? -valor : valor, competence_date: competencia });
      } else {
        const irmas = (await store.list('transactions', { owner_id: state.user.id }))
          .filter((t) => t.installment_group === tx.installment_group);
        const primeira = addMonthsDay(competencia, -(tx.installment_n - 1));
        for (const t of irmas) {
          await store.update('transactions', t.id, {
            description: campos.description, tag_id: campos.tag_id, purchase_date: data, ...extraCampo,
            ...('extraordinario_cents' in campos ? { extraordinario_cents: extraCentsDe(mudouValor ? valor : t.amount_cents) } : {}),
            competence_date: addMonthsDay(primeira, t.installment_n - 1),
            ...(mudouValor ? { amount_cents: valor } : {}),
          });
        }
      }
    } else {
      await store.update('transactions', tx.id, { ...campos, amount_cents: estorno ? -valor : valor,
        purchase_date: data, competence_date: competencia });
    }
    return true;
  });
  btn.disabled = false;
  if (ok) { fecharModal(); avisar(tx ? 'Lançamento atualizado' : 'Lançamento salvo'); await router.go('mes'); }
}

function confirmarExclusao(tx) {
  const grupo = tx.installment_group && tx.installment_total > 1;
  const rec = !!tx.recurrence_id;
  const corpo = grupo
    ? `<p>“${esc(tx.description)}” é a parcela ${tx.installment_n} de ${tx.installment_total}.</p>
       <div class="rodape-modal"><button class="btn" id="excluir-so-esta">Só esta parcela</button>
       <button class="btn btn-principal" id="excluir-todas">Todas as parcelas</button></div>`
    : rec
      ? `<p>“${esc(tx.description)}” vem de um recorrente. Se excluir, ele volta na próxima vez que o mês for aberto.
         Para não cobrar neste mês, use “Pular este mês”. Para parar de vez, pause ou encerre em Recorrentes.</p>
         <div class="rodape-modal"><button class="btn" id="excluir-cancelar">Cancelar</button>
         <button class="btn btn-principal" id="excluir-pular">Pular este mês</button></div>`
      : `<p>Excluir “${esc(tx.description || TIPOS[tx.kind])}” de ${num(tx.amount_cents)}?</p>
         <div class="rodape-modal"><button class="btn" id="excluir-cancelar">Cancelar</button>
         <button class="btn btn-principal" id="excluir-confirmar">Excluir</button></div>`;
  abrirModal(`<div class="topo"><h2>Excluir lançamento</h2>
    <button class="btn-icone" id="excluir-fechar" aria-label="Fechar"><i class="ti ti-x"></i></button></div>${corpo}`, (m) => {
    const fim = async (fn, msg) => { if (await tentar(async () => { await fn(); return true; })) { fecharModal(); avisar(msg); router.go('mes'); } };
    $('#excluir-fechar', m).addEventListener('click', fecharModal);
    const c = $('#excluir-cancelar', m); if (c) c.addEventListener('click', fecharModal);
    const b = (id, fn, msg) => { const el = $(id, m); if (el) el.addEventListener('click', () => fim(fn, msg)); };
    b('#excluir-confirmar', () => store.remove('transactions', tx.id), 'Lançamento excluído');
    b('#excluir-so-esta', () => store.remove('transactions', tx.id), 'Parcela excluída');
    b('#excluir-todas', () => store.removeWhere('transactions', { installment_group: tx.installment_group }), 'Parcelas excluídas');
    b('#excluir-pular', () => store.update('transactions', tx.id, { amount_cents: 0, description: `${tx.description} (pulado)` }), 'Pulado neste mês');
  });
}

TELAS.tags = async function (el) {
  const [tags, budgets] = await Promise.all([store.list('tags'), store.list('budgets', { owner_id: state.user.id })]);
  state.tags = tags.sort((a, b) => a.name.localeCompare(b.name, 'pt-BR'));
  const limite = new Map(budgets.map((b) => [b.tag_id, b.monthly_cents]));
  // Ativas primeiro (por nome), arquivadas por último.
  const maes = state.tags.filter((t) => !t.parent_id).sort((a, b) => (a.archived - b.archived) || a.name.localeCompare(b.name, 'pt-BR'));
  const acoes = (t) => `
        <button class="btn-icone tag-editar" aria-label="Editar ${esc(t.name)}"><i class="ti ti-pencil"></i></button>
        <button class="btn-icone tag-arquivar" aria-label="${t.archived ? 'Desarquivar' : 'Arquivar'} ${esc(t.name)}">

        <button class="btn-icone tag-excluir" aria-label="Excluir ${esc(t.name)}"><i class="ti ti-trash"></i></button>`;
  const html = maes.map((t) => {
    const subs = state.tags.filter((x) => x.parent_id === t.id)
      .sort((a, b) => (a.archived - b.archived) || a.name.localeCompare(b.name, 'pt-BR'));
    return `<div class="bloco bloco-tag ${t.archived ? 'arquivada' : ''}" data-id="${t.id}">
      <div class="bloco-topo">

// Excluir de vez: avisa quantas subtags e lançamentos seus são afetados (cada um tem as próprias tags).
async function confirmarExclusaoTag(tag, tela) {
  const subs = state.tags.filter((t) => t.parent_id === tag.id);
  const ids = new Set([tag.id, ...subs.map((t) => t.id)]);
  const lancs = (await tentar(() => store.list('transactions')) || []).filter((t) => ids.has(t.tag_id)).length;
  const partes = [];
  if (subs.length) partes.push(`${subs.length} ${subs.length === 1 ? 'subtag' : 'subtags'} dentro dela também ${subs.length === 1 ? 'será excluída' : 'serão excluídas'}`);
  partes.push(lancs ? `${lancs} ${lancs === 1 ? 'lançamento fica' : 'lançamentos ficam'} sem tag` : 'nenhum lançamento usa essa tag');
  abrirModal(`<div class="topo"><h2>Excluir “${esc(tag.name)}”?</h2></div>
    <p>${partes.join('; ')}. O limite de orçamento dela também sai. Isso não pode ser desfeito.</p>

function ligarArquivar(el, tela) {

function camposCorIcone(f) {
  const vistos = new Set();
  const grupos = GRUPOS_ICONES.map(([nome, lista]) => {
    const unicos = lista.filter((i) => !vistos.has(i) && vistos.add(i));
    return `<div class="grupo-icones"><div class="suave" style="margin:8px 0 4px">${nome}</div><div class="icones">${unicos.map((i) =>
      `<button data-icone="${i}" class="${i === f.icone ? 'ativo' : ''}" aria-label="${i}"><i class="ti ti-${i}"></i></button>`).join('')}</div></div>`;
  }).join('');
  return `<div class="campo"><span>Cor</span><div class="paleta">${CORES_TAG.map((c) =>
      `<button data-cor="${c}" class="${c.toLowerCase() === f.cor.toLowerCase() ? 'ativo' : ''}" style="background:${c}" aria-label="Cor ${c}"></button>`).join('')}</div>
      <label class="suave" style="display:flex; gap:8px; align-items:center; margin-top:8px">Outra cor:
        <input type="color" id="cor-livre" value="${/^#[0-9a-f]{6}$/i.test(f.cor) ? f.cor : '#6f4e37'}" style="width:44px; height:30px; padding:0; border:none; background:none"></label></div>
    <div class="campo"><span>Ícone</span>${grupos}</div>`;
}
function ligarCorIcone(m, f) {
  const atualizar = () => {
    $$('[data-cor]', m).forEach((b) => b.classList.toggle('ativo', b.dataset.cor.toLowerCase() === f.cor.toLowerCase()));
    $$('[data-icone]', m).forEach((b) => b.classList.toggle('ativo', b.dataset.icone === f.icone));
  };
  $$('[data-cor]', m).forEach((b) => b.addEventListener('click', () => { f.cor = b.dataset.cor; $('#cor-livre', m).value = f.cor.toLowerCase(); atualizar(); }));
  $('#cor-livre', m).addEventListener('input', (e) => { f.cor = e.target.value; atualizar(); });
  $$('[data-icone]', m).forEach((b) => b.addEventListener('click', () => { f.icone = b.dataset.icone; atualizar(); }));
}

function abrirTag(tag, limite) {
  const f = { cor: tag ? tag.color : '#C68B59', icone: tag ? tag.icon : 'tag' };
  const lim = tag && limite.has(tag.id) ? formatBRL(limite.get(tag.id)).replace(/[^\d,.]/g, '') : '';

      <button class="btn btn-principal" id="tag-salvar">Salvar</button></div>`, (m) => {

    $('#tag-cancelar', m).addEventListener('click', fecharModal);

}

function abrirSubtag(sub, maePadrao) {
  const f = { cor: sub ? sub.color : '#D4A373', icone: sub ? sub.icon : 'tag' };
  const maes = state.tags.filter((t) => !t.parent_id && (!t.archived || (sub && t.id === sub.parent_id)));
  abrirModal(`
    <div class="topo"><h2>${sub ? 'Editar subtag' : 'Nova subtag'}</h2>
      <button class="btn-icone" id="subtag-fechar" aria-label="Fechar"><i class="ti ti-x"></i></button></div>
    <label class="campo"><span>Nome</span><input id="subtag-nome" value="${esc(sub ? sub.name : '')}" placeholder="Mercado" autofocus></label>
    <label class="campo"><span>Pertence à tag</span><select id="subtag-tag">
      <option value="">Escolha uma tag</option>
      ${maes.map((m) => `<option value="${m.id}" ${(sub ? sub.parent_id : maePadrao) === m.id ? 'selected' : ''}>${esc(m.name)}</option>`).join('')}
    </select></label>
    ${camposCorIcone(f)}
    <div class="erro" id="subtag-erro" role="alert"></div>

    $('#subtag-cancelar', m).addEventListener('click', fecharModal);

      const nome = $('#subtag-nome', m).value.trim(), mae = $('#subtag-tag', m).value;
      if (!nome) { $('#subtag-erro', m).textContent = 'Dê um nome para a subtag.'; return; }

        if (sub) await store.update('tags', sub.id, campos); else await store.insert('tags', campos);
        return true;
      });
      if (ok) { fecharModal(); avisar('Subtag salva'); router.go('tags'); }
    });
  });

async function salvarTag(tag, f, limite) {
  const nome = $('#tag-nome').value.trim();
  if (!nome) { $('#tag-erro').textContent = 'Dê um nome para a tag.'; return; }
  const ok = await tentar(async () => {
    const campos = { name: nome, color: f.cor, icon: f.icone };
    if (tag) await store.update('tags', tag.id, campos); else await store.insert('tags', { ...campos, parent_id: null });
    return true;
  });
  if (ok) { fecharModal(); avisar('Tag salva'); router.go('tags'); }
}

function mesCurto(iso) { return `${MESES_CURTOS[Number(iso.slice(5, 7)) - 1]}/${iso.slice(0, 4)}`; }

  const recs = (await store.list('recurrences', { owner_id: state.user.id }))
    .sort((a, b) => a.day_of_month - b.day_of_month || a.description.localeCompare(b.description, 'pt-BR'));
  const hojeM = monthStart(todayISO());
  const linhas = recs.map((r) => {
    const encerrado = r.end_month && monthStart(r.end_month) < hojeM;
    const status = r.paused ? 'Pausado' : r.end_month ? `Até ${mesCurto(r.end_month)}` : `Desde ${mesCurto(r.start_month)}`;
    const det = [`todo dia ${r.day_of_month}`, TIPOS[r.kind]];
    if (r.payment) det.push(PAGAMENTOS[r.payment] + (r.payment === 'credito' ? ' (conta no dia 10 do mês seguinte)' : ''));
    if (r.tag_id) det.push(esc(tagNome(r.tag_id)));
    return `<div class="item rec-linha ${r.paused || encerrado ? 'arquivada' : ''}" data-id="${r.id}" style="${r.paused || encerrado ? 'opacity:.6' : ''}">

        <button class="btn-icone rec-pausar" aria-label="${r.paused ? 'Retomar' : 'Pausar'}"><i class="ti ti-player-${r.paused ? 'play' : 'pause'}"></i></button>

  el.innerHTML = `

    const r = porId(b);

  }));
  $$('.rec-encerrar', el).forEach((b) => b.addEventListener('click', () => {
    const r = porId(b);
    abrirModal(`<div class="topo"><h2>Encerrar recorrente</h2></div>
      <p>“${esc(r.description)}” será lançado pela última vez em ${mesCurto(todayISO())} e não volta nos próximos meses.</p>
      <div class="rodape-modal"><button class="btn" id="rec-encerrar-cancelar">Cancelar</button>
      <button class="btn btn-principal" id="rec-encerrar-confirmar">Encerrar</button></div>`, (m) => {
      $('#rec-encerrar-cancelar', m).addEventListener('click', fecharModal);
      $('#rec-encerrar-confirmar', m).addEventListener('click', async () => {
        if (await tentar(() => store.update('recurrences', r.id, { end_month: monthStart(todayISO()) }))) { fecharModal(); avisar('Recorrente encerrado'); router.go('recorrentes'); }

// ---------- orçamento (planejamento do mês) ----------
// Base: o que já entrou no mês. Os limites das tags de gasto são comparados com essa renda.
// Tags usadas só com receitas (nos últimos 12 meses) viram "metas de receita".
TELAS.orcamento = async function (el) {
  const ini = mesISO(), fim = monthEnd(ini);
  const [historico, budgets] = await Promise.all([
    store.list('transactions', { owner_id: state.user.id, competence_from: addMonths(ini, -11), competence_to: fim }),
    store.list('budgets', { owner_id: state.user.id }),
  ]);
  const meus = filtrarDono(historico);
  const doMes = meus.filter((t) => t.competence_date >= ini && t.competence_date <= fim);
  const resumo = monthSummary(doMes);
  const renda = resumo.receitas;

  const usos = new Map();
  for (const t of meus) {
    if (!t.tag_id) continue;
    const k = rootTagId(t.tag_id, state.tags), u = usos.get(k) || { r: 0, g: 0 };
    if (t.kind === 'receita') u.r++; else u.g++;
    usos.set(k, u);
  }
  const ehReceita = (id) => { const u = usos.get(id); return !!u && u.r > 0 && u.g === 0; };

  const limite = new Map();
  for (const b of filtrarDono(budgets)) limite.set(rootTagId(b.tag_id, state.tags), b);
  const maes = tagsPrincipais([...limite.keys()]);
  const despesas = maes.filter((t) => !ehReceita(t.id));
  const metasReceita = maes.filter((t) => ehReceita(t.id));
  const { comuns, extras } = orcamentoPorTag(doMes, state.tags);
  const receitasTag = totalsByRootTag(doMes.filter((t) => t.kind === 'receita').map((t) => ({ ...t, kind: 'gasto' })), state.tags);

  const planejado = despesas.reduce((s, t) => s + (limite.has(t.id) ? limite.get(t.id).monthly_cents : 0), 0);
  // Cartão do topo: só gastos (investimento e doação têm os próprios totais).
  const gastoComum = doMes.filter((t) => t.kind === 'gasto').reduce((a, t) => a + t.amount_cents - valorExtra(t), 0);
  const totalExtra = [...extras.values()].reduce((a, b) => a + b, 0);
  const pctRenda = (v) => (renda > 0 ? `${Math.round((v / renda) * 100)}%` : '—');
  const valorCampo = (b) => (b ? mascaraDigitos(String(b.monthly_cents)) : '');

  let encaixeClasse, encaixeTexto;
  if (renda <= 0) {
    encaixeClasse = 'sem-renda';
    encaixeTexto = 'Ainda não entrou nada neste mês. O encaixe aparece quando você lançar as receitas.';
  } else if (planejado <= renda) {
    encaixeClasse = 'encaixa';
    encaixeTexto = `Cabe na renda. Sobra planejada ${num(renda - planejado)} (${pctRenda(renda - planejado)} do que entrou).`;
  } else {
    encaixeClasse = 'nao-encaixa';
    encaixeTexto = `Não cabe: os limites passam ${num(planejado - renda)} do que entrou.`;
  }
  const escalaBarra = Math.max(renda, planejado, 1);
  const segmentos = despesas.filter((t) => limite.has(t.id)).map((t) =>
    `<div title="${esc(t.name)}" style="width:${(limite.get(t.id).monthly_cents / escalaBarra) * 100}%; background:${esc(t.color)}"></div>`).join('') +
    (renda > planejado ? `<div title="Sobra" style="width:${((renda - planejado) / escalaBarra) * 100}%; background:#B9CFA0"></div>` : '');

  const investe = tagsDeInvestimento(meus, state.tags);
  const linhaDespesa = (t) => {
    const b = limite.get(t.id), lim = b ? b.monthly_cents : 0, gasto = comuns.get(t.id) || 0, extra = extras.get(t.id) || 0;
    const st = statusBarra(gasto, lim, investe.has(t.id)), pct = lim ? Math.min(100, Math.round((gasto / lim) * 100)) : 0;
    return `<div class="orc-linha" data-tag="${t.id}">
      <div class="orc-topo">
        <span class="bolinha" style="background:${esc(t.color)}"><i class="ti ti-${esc(t.icon)}"></i></span>
        <span class="orc-nome">${esc(t.name)}</span>
        <label class="orc-campo"><span class="sr-only">Limite de ${esc(t.name)}</span>
          <input class="orc-limite" data-moeda inputmode="numeric" placeholder="Sem limite" value="${valorCampo(b)}"></label>
      </div>
      <div class="suave ${st === 'superou' ? 'positivo' : ''}">${lim ? `<span class="num">${pctRenda(lim)}</span> do que entrou · ` : ''}saiu ${num(gasto)}${lim ? ` de ${brlLim(lim)}` : ''}</div>
      ${lim ? `<div class="barra ${st}"><div style="width:${pct}%"></div></div>` : ''}
      ${extra ? `<div class="suave nota-extra">+ ${num(extra)} extraordinário (fora do orçamento)</div>` : ''}
    </div>`;
  };
  const linhaReceita = (t) => {
    const b = limite.get(t.id), lim = b ? b.monthly_cents : 0, entrou = receitasTag.get(t.id) || 0;
    return `<div class="orc-linha" data-tag="${t.id}">
      <div class="orc-topo">
        <span class="bolinha" style="background:${esc(t.color)}"><i class="ti ti-${esc(t.icon)}"></i></span>
        <span class="orc-nome">${esc(t.name)}</span>
        <label class="orc-campo"><span class="sr-only">Meta de ${esc(t.name)}</span>
          <input class="orc-limite" data-moeda inputmode="numeric" placeholder="Sem meta" value="${valorCampo(b)}"></label>
      </div>
      <div class="suave positivo">Entrou ${num(entrou)}${lim ? ` de ${brlLim(lim)}` : ''}</div>
      ${lim ? `<div class="barra receita"><div style="width:${Math.min(100, Math.round((entrou / lim) * 100))}%"></div></div>` : ''}
    </div>`;
  };

  el.innerHTML = `
    <div class="nav-mes">
      <button class="btn-icone" id="orc-anterior" aria-label="Mês anterior"><i class="ti ti-chevron-left"></i></button>
      <h1>${MESES[state.month - 1]} ${state.year}</h1>
      <button class="btn-icone" id="orc-seguinte" aria-label="Próximo mês"><i class="ti ti-chevron-right"></i></button>
    </div>
    <div class="resumo">
      <div class="cartao" id="orc-renda"><div class="rotulo">Entrou no mês</div><div class="valor positivo">${num(renda)}</div></div>
      <div class="cartao" id="orc-planejado"><div class="rotulo">Limites planejados</div><div class="valor">${formatBRL(planejado)}</div>
        <div class="suave">${pctRenda(planejado)} do que entrou</div></div>
      <div class="cartao" id="orc-gasto"><div class="rotulo">Gasto até agora</div><div class="valor">${num(gastoComum)}</div>
        <div class="suave">sem extraordinários</div></div>
      <div class="cartao" id="orc-real"><div class="rotulo">Sobra real do mês</div>
        <div class="valor ${resumo.livre < 0 ? 'negativo' : ''}">${num(resumo.livre)}</div>
        <div class="suave">entrou − saiu − investido − doado</div></div>
    </div>
    <div class="cartao ${encaixeClasse}" id="orc-encaixe">
      <h2>Os limites cabem no que entrou?</h2>
      <p style="margin:6px 0">${encaixeTexto}</p>
      ${renda > 0 && segmentos ? `<div class="barra-empilhada">${segmentos}</div>` : ''}
      ${totalExtra ? `<p class="suave" style="margin:8px 0 0">Extraordinários do mês: ${num(totalExtra)} (fora do orçamento, mas contam na sobra real).</p>` : ''}
    </div>
    <div class="colunas">
      <div class="cartao"><h2>Limites por tag</h2>
        <p class="suave" style="margin:2px 0 8px">Digite o limite e aperte Enter (ou toque fora). Apague para tirar o limite.</p>
        <div id="orc-tags">${despesas.map(linhaDespesa).join('') || '<p class="suave">Crie tags em Tags para planejar os gastos.</p>'}</div></div>
      <div class="cartao"><h2>Metas de receita</h2>
        <p class="suave" style="margin:2px 0 8px">Tags usadas só com receitas, como Renda extra. Não entram na conta dos limites.</p>
        <div id="orc-receitas">${metasReceita.map(linhaReceita).join('') || '<p class="suave">Nenhuma tag de receita ainda.</p>'}</div></div>
    </div>`;

  $('#orc-anterior', el).addEventListener('click', () => { mudarMes(-1); router.go('orcamento'); });
  $('#orc-seguinte', el).addEventListener('click', () => { mudarMes(1); router.go('orcamento'); });
  ligarMascaras(el);
  $$('.orc-limite', el).forEach((campo) => {
    const salvar = async () => {
      if (campo.dataset.salvando) return;
      const tagId = campo.closest('.orc-linha').dataset.tag;
      const atual = limite.get(tagId);
      const novo = campo.value.trim() ? parseBRL(campo.value) : 0;
      if (novo === null || novo < 0) { avisar('Limite inválido. Use algo como 1.000,00.', 'erro'); return; }
      if ((atual ? atual.monthly_cents : 0) === novo) return;
      campo.dataset.salvando = '1';
      const ok = await tentar(async () => {
        if (!novo) await store.remove('budgets', atual.id);
        else if (atual) await store.update('budgets', atual.id, { monthly_cents: novo });
        else await store.insert('budgets', { tag_id: tagId, monthly_cents: novo });
        return true;
      });
      if (ok) { avisar(novo ? 'Limite salvo' : 'Limite removido'); router.go('orcamento'); } else delete campo.dataset.salvando;
    };
    campo.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); salvar(); } });
    campo.addEventListener('change', salvar);
  });
};

// ---------- dashboards ----------
// Cada gráfico tem os próprios filtros; eles ficam salvos neste navegador e não mexem na tela Mês.
const MEDIDAS = { gastos: 'Gastos', receitas: 'Receitas', investido: 'Investido', doacoes: 'Doações', livre: 'Livre (sobra)' };
const SERIES_EVO = [['receitas', 'Entrou', '#5B7A3A'], ['gastos', 'Saiu', '#C68B59'], ['investido', 'Investido', '#3B2416'], ['doacoes', 'Doado', '#9C6644']];

function filtrosPadrao() {
  const t = todayISO(), ano = Number(t.slice(0, 4)), mes = Number(t.slice(5, 7));
  return {
    tag: { periodo: 'mes', mes, ano, formato: 'barras' },
    evo: { ano, formato: 'barras', series: ['receitas', 'gastos', 'investido', 'doacoes'] },
    comp: { medida: 'gastos', modo: 'mes', mes, anos: null, formato: 'barras' },
    ap: { ano, modo: 'mensal', formato: 'barras' },
  };
}
function carregarFiltros() {
  const padrao = filtrosPadrao();
  try {
    const salvo = JSON.parse(localStorage.getItem('dash-filtros') || 'null');
    if (salvo) for (const k of Object.keys(padrao)) Object.assign(padrao[k], salvo[k] || {});
  } catch (e) { /* sem armazenamento: usa o padrão */ }
  return padrao;
}
function salvarFiltros() { try { localStorage.setItem('dash-filtros', JSON.stringify(state.dashF)); } catch (e) { /* ignora */ } }
state.dash = { tagAberta: null };

function selectHTML(id, opcoes, atual, rotulo) {
  return `<select id="${id}" class="chip" aria-label="${rotulo}">${opcoes.map(([v, t]) =>
    `<option value="${v}" ${String(v) === String(atual) ? 'selected' : ''}>${t}</option>`).join('')}</select>`;
}
const OPC_MESES = MESES.map((n, i) => [i + 1, n]);

TELAS.dashboards = async function (el) {
  if (!state.dashF) state.dashF = carregarFiltros();
  const F = state.dashF;
  const todos = filtrarDono(await store.list('transactions'));
  const anoAtual = Number(todayISO().slice(0, 4));
  const anos = [...new Set(todos.map((t) => Number(t.competence_date.slice(0, 4))).concat([anoAtual]))].sort();
  const opcAnos = anos.map((a) => [a, a]);
  const doAno = (a) => todos.filter((t) => Number(t.competence_date.slice(0, 4)) === a);

  // Gasto por tag
  const doPeriodo = F.tag.periodo === 'ano' ? doAno(F.tag.ano)
    : doAno(F.tag.ano).filter((t) => Number(t.competence_date.slice(5, 7)) === F.tag.mes);
  const somas = totalsByRootTag(doPeriodo, state.tags);
  for (const t of state.tags) if (!t.parent_id && !t.archived && !somas.has(t.id)) somas.set(t.id, 0);
  const porTag = [...somas.entries()].sort((a, b) => b[1] - a[1] ||
    (tagPorId(a[0]) || { name: '' }).name.localeCompare((tagPorId(b[0]) || { name: '' }).name, 'pt-BR'));
  const semTags = !state.tags.some((t) => !t.parent_id);
  const totalGasto = monthSummary(doPeriodo).gastos;
  const aberta = state.dash.tagAberta && porTag.some(([k]) => k === state.dash.tagAberta) ? state.dash.tagAberta : null;

  // Comparativo
  const anosComp = (F.comp.anos ? anos.filter((a) => F.comp.anos.includes(a)) : anos.slice(-6));
  const mesComp = F.comp.modo === 'mes' ? F.comp.mes : null;

  // Aportes
  const serieAp = monthlySeries(todos, F.ap.ano).map((m) => m.investido);
  const aporteAno = serieAp.reduce((a, b) => a + b, 0);

  const formatos = (id, atual, opcoes) => selectHTML(id, opcoes, atual, 'Formato do gráfico');
  el.innerHTML = `
    <div class="barra-titulo"></div>
    <div class="colunas">
      <div class="cartao"><h2>Gasto por tag</h2>
        <div class="chips filtros-graf">
          ${selectHTML('f-tag-periodo', [['mes', 'Um mês'], ['ano', 'Ano inteiro']], F.tag.periodo, 'Período')}
          ${F.tag.periodo === 'mes' ? selectHTML('f-tag-mes', OPC_MESES, F.tag.mes, 'Mês') : ''}
          ${selectHTML('f-tag-ano', opcAnos, F.tag.ano, 'Ano')}
          ${formatos('f-tag-formato', F.tag.formato, [['barras', 'Barras'], ['rosca', 'Rosca']])}
        </div>
        <p class="suave" style="margin:8px 0">${F.tag.periodo === 'ano' ? `Em ${F.tag.ano}` : `${MESES[F.tag.mes - 1]} ${F.tag.ano}`}:
          <strong id="dash-total-gasto">${num(totalGasto)}</strong></p>
        <div class="grafico" style="height:${F.tag.formato === 'rosca' ? 260 : Math.max(160, porTag.length * 36)}px"><canvas id="graf-tag"></canvas></div>
        <div class="chips" style="margin-top:10px">${porTag.map(([k, v]) =>
          `<button class="chip dash-tag ${k === aberta ? 'ativo' : ''}" data-tag="${k}">${esc(k === 'sem-tag' ? 'Sem tag' : tagNome(k))} · ${num(v)}</button>`).join('')}</div>
        ${semTags ? '<p class="vazio">Crie tags em Tags para ver aqui para onde vai o dinheiro.</p>'
          : totalGasto === 0 ? '<p class="suave">Nenhum gasto neste período ainda.</p>'
          : '<p class="suave">Toque numa tag para ver as subtags.</p>'}
        ${aberta ? `<h3 style="margin-top:12px">${esc(tagNome(aberta))} por subtag</h3><div class="grafico" style="height:200px"><canvas id="graf-subtag"></canvas></div>` : ''}
      </div>
      <div style="display:grid; grid-template-columns:minmax(0, 1fr); gap:14px">
        <div class="cartao"><h2>Mês a mês</h2>
          <div class="chips filtros-graf">
            ${selectHTML('f-evo-ano', opcAnos, F.evo.ano, 'Ano')}
            ${formatos('f-evo-formato', F.evo.formato, [['barras', 'Barras'], ['linhas', 'Linhas']])}
            ${SERIES_EVO.map(([k, nome]) => `<button class="chip ${F.evo.series.includes(k) ? 'ativo' : ''}" data-serie="${k}">${nome}</button>`).join('')}
          </div>
          <div class="grafico"><canvas id="graf-evolucao"></canvas></div></div>
        <div class="cartao"><h2>Comparativo entre anos</h2>
          <div class="chips filtros-graf">
            ${selectHTML('f-comp-medida', Object.entries(MEDIDAS), F.comp.medida, 'O que comparar')}
            ${selectHTML('f-comp-modo', [['mes', 'Mesmo mês'], ['ano', 'Ano inteiro']], F.comp.modo, 'Como comparar')}
            ${F.comp.modo === 'mes' ? selectHTML('f-comp-mes', OPC_MESES, F.comp.mes, 'Mês') : ''}
            ${formatos('f-comp-formato', F.comp.formato, [['barras', 'Barras'], ['linhas', 'Linhas']])}
          </div>
          <div class="chips" style="margin-top:6px" aria-label="Anos">${anos.map((a) =>
            `<button class="chip ${anosComp.includes(a) ? 'ativo' : ''}" data-comp-ano="${a}">${a}</button>`).join('')}</div>
          <p class="suave" id="titulo-comparativo" style="margin:8px 0">${MEDIDAS[F.comp.medida]} · ${mesComp ? `${MESES[mesComp - 1]} de cada ano` : 'ano inteiro, ano a ano'}</p>
          <div class="grafico"><canvas id="graf-comparativo"></canvas></div></div>
        <div class="cartao"><h2>Aportes em investimentos</h2>
          <div class="chips filtros-graf">
            ${selectHTML('f-ap-ano', opcAnos, F.ap.ano, 'Ano')}
            ${selectHTML('f-ap-modo', [['mensal', 'Por mês'], ['acumulado', 'Acumulado no ano']], F.ap.modo, 'Como mostrar')}
            ${formatos('f-ap-formato', F.ap.formato, [['barras', 'Barras'], ['linhas', 'Linhas']])}
          </div>
          <p class="suave" style="margin:8px 0 4px">Total aportado em ${F.ap.ano}</p><div class="destaque" id="aportes-total">${num(aporteAno)}</div>
          <div class="grafico" style="height:180px"><canvas id="graf-aportes"></canvas></div></div>
      </div>
    </div>`;

  const ligar = (id, grupo, campo, num) => {
    const c = $('#' + id, el);
    if (c) c.addEventListener('input', (e) => { F[grupo][campo] = num ? Number(e.target.value) : e.target.value; salvarFiltros(); router.go('dashboards'); });
  };
  ligar('f-tag-periodo', 'tag', 'periodo'); ligar('f-tag-mes', 'tag', 'mes', true); ligar('f-tag-ano', 'tag', 'ano', true); ligar('f-tag-formato', 'tag', 'formato');
  ligar('f-evo-ano', 'evo', 'ano', true); ligar('f-evo-formato', 'evo', 'formato');
  ligar('f-comp-medida', 'comp', 'medida'); ligar('f-comp-modo', 'comp', 'modo'); ligar('f-comp-mes', 'comp', 'mes', true); ligar('f-comp-formato', 'comp', 'formato');
  ligar('f-ap-ano', 'ap', 'ano', true); ligar('f-ap-modo', 'ap', 'modo'); ligar('f-ap-formato', 'ap', 'formato');
  $$('[data-serie]', el).forEach((b) => b.addEventListener('click', () => {
    const k = b.dataset.serie, lista = F.evo.series;
    F.evo.series = lista.includes(k) ? lista.filter((x) => x !== k) : SERIES_EVO.map(([s]) => s).filter((s) => s === k || lista.includes(s));
    salvarFiltros(); router.go('dashboards');
  }));
  $$('[data-comp-ano]', el).forEach((b) => b.addEventListener('click', () => {
    const a = Number(b.dataset.compAno);
    const atual = anosComp.slice();
    F.comp.anos = atual.includes(a) ? atual.filter((x) => x !== a) : atual.concat([a]).sort();
    salvarFiltros(); router.go('dashboards');
  }));
  $$('.dash-tag', el).forEach((b) => b.addEventListener('click', () => {
    state.dash.tagAberta = state.dash.tagAberta === b.dataset.tag ? null : b.dataset.tag; router.go('dashboards');
  }));

  const nomeTag = (k) => (k === 'sem-tag' ? 'Sem tag' : (tagPorId(k) || { name: 'Tag removida' }).name);
  const corTag = (k) => tagVisual(k === 'sem-tag' ? null : k).cor;
  const tipoTag = F.tag.formato === 'rosca' ? 'doughnut' : 'bar';
  desenharGrafico('graf-tag', tipoTag, porTag.map(([k]) => nomeTag(k)),
    [{ label: 'Gasto', data: porTag.map(([, v]) => reais(v)), backgroundColor: porTag.map(([k]) => corTag(k)), borderRadius: tipoTag === 'bar' ? 6 : 0 }],
    { horizontal: tipoTag === 'bar', onClick: (_e, els) => { if (els.length) { state.dash.tagAberta = porTag[els[0].index][0]; router.go('dashboards'); } } });
  if (aberta) {
    const daRaiz = doPeriodo.filter((t) => t.kind === 'gasto' && rootTagId(t.tag_id, state.tags) === aberta);
    const subs = [...totalsByTag(daRaiz).entries()].sort((a, b) => b[1] - a[1]);
    desenharGrafico('graf-subtag', 'bar', subs.map(([k]) => (k === aberta ? `${nomeTag(k)} (direto)` : nomeTag(k))),
      [{ label: 'Gasto', data: subs.map(([, v]) => reais(v)), backgroundColor: subs.map(([k]) => corTag(k)), borderRadius: 6 }], { horizontal: true });
  }
  const linhaOuBarra = (f) => (f === 'linhas' ? 'line' : 'bar');
  const estilo = (cor, tipo) => (tipo === 'line'
    ? { borderColor: cor, backgroundColor: cor, tension: 0.25, pointRadius: 3, borderWidth: 2 }
    : { backgroundColor: cor, borderRadius: 4 });
  const serie = monthlySeries(todos, F.evo.ano);
  const tipoEvo = linhaOuBarra(F.evo.formato);
  desenharGrafico('graf-evolucao', tipoEvo, MESES_CURTOS, SERIES_EVO.filter(([k]) => F.evo.series.includes(k)).map(([k, nome, cor]) =>
    ({ label: nome, data: serie.map((m) => reais(m[k])), ...estilo(cor, tipoEvo) })));
  const tipoComp = linhaOuBarra(F.comp.formato);
  desenharGrafico('graf-comparativo', tipoComp, anosComp.map(String), [{
    label: MEDIDAS[F.comp.medida], data: valoresPorAno(todos, anosComp, mesComp, F.comp.medida).map(reais),
    ...estilo(tipoComp === 'bar' ? anosComp.map((a) => (a === anoAtual ? '#3B2416' : '#C68B59')) : '#3B2416', tipoComp),
  }]);
  const tipoAp = linhaOuBarra(F.ap.formato);
  const valoresAp = F.ap.modo === 'acumulado' ? acumular(serieAp) : serieAp;
  desenharGrafico('graf-aportes', tipoAp, MESES_CURTOS,
    [{ label: F.ap.modo === 'acumulado' ? 'Acumulado' : 'Aportado', data: valoresAp.map(reais), ...estilo('#6F4E37', tipoAp) }]);
};

// ---------- ano ----------

  const serie = monthlySeries(txs, ano);

  el.innerHTML = `
    <div class="nav-mes">
      <button class="btn-icone" id="ano-anterior" aria-label="Ano anterior"><i class="ti ti-chevron-left"></i></button>
      <h1 id="ano-titulo">${ano}</h1>
      <button class="btn-icone" id="ano-seguinte" aria-label="Próximo ano"><i class="ti ti-chevron-right"></i></button>
    </div>
    
    <div class="resumo">
      <div class="cartao"><div class="rotulo">Entrou no ano</div><div class="valor positivo">${num(total.receitas)}</div></div>
      <div class="cartao"><div class="rotulo">Investido no ano</div><div class="valor">${num(total.investido)}</div></div>
      <div class="cartao"><div class="rotulo">Doado no ano</div><div class="valor">${num(total.doacoes)}</div></div>

        <div class="suave">só gastos ${num(total.gastos)}</div></div>
      <div class="cartao livre"><div class="rotulo">Livre no ano</div><div class="valor ${total.livre < 0 ? 'negativo' : ''}">${num(total.livre)}</div></div>
    </div>
    <div class="grade" id="grade-ano">${serie.map((m) => {
      const livre = m.receitas - m.gastos - m.investido - m.doacoes;
      return `<button class="cartao mes-ano" data-mes="${m.mes}" style="text-align:left">
        <h3>${MESES[m.mes - 1]}</h3>
        <div class="suave">Entrou <span class="positivo">${num(m.receitas)}</span></div>
        <div class="suave">Saiu ${num(m.gastos + m.investido + m.doacoes)}</div>
        <div><strong class="${livre < 0 ? 'negativo' : ''}">Livre ${num(livre)}</strong></div></button>`;
    }).join('')}</div>`;
  $('#ano-anterior', el).addEventListener('click', () => { state.year -= 1; router.go('ano'); });
  $('#ano-seguinte', el).addEventListener('click', () => { state.year += 1; router.go('ano'); });
  $$('.mes-ano', el).forEach((b) => b.addEventListener('click', () => { state.month = Number(b.dataset.mes); router.go('mes'); }));
};

// ---------- configurações, backup e exportação ----------
const TABELAS_BACKUP = ['profiles', 'tags', 'recurrences', 'goals', 'transactions', 'goal_deposits', 'budgets'];

function baixarArquivo(nome, conteudo, tipo) {
  const url = URL.createObjectURL(new Blob([conteudo], { type: tipo }));
  const a = document.createElement('a');
  a.href = url; a.download = nome; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function campoCSV(v) {
  const s = String(v == null ? '' : v);
  return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

TELAS.config = async function (el) {
  const eu = state.people.find((p) => p.id === state.user.id) || { name: '' };
  el.innerHTML = `
    <div class="cartao"><h2>Seu nome no app</h2>
      <label class="campo"><span>Nome de exibição</span><input id="config-nome" value="${esc(eu.name)}"></label>
