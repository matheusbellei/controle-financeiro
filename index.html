    <div class="cartao" id="frases-cartao"><h2>Frases no lembrete</h2></div>
    <div class="cartao"><h2>Backup e exportação</h2>
      <p class="suave">O backup em JSON guarda tudo e pode ser importado de volta. Guarde uma cópia de vez em quando (Drive, e-mail ou GitHub).</p>
      <div class="chips"><button class="btn" id="exportar-json"><i class="ti ti-download"></i>Exportar backup (JSON)</button>
        <button class="btn" id="exportar-csv"><i class="ti ti-table-export"></i>Exportar lançamentos (CSV)</button></div>
      <label class="campo"><span>Importar backup (JSON) — só traz de volta o que estiver faltando</span>
        <input id="importar-json" type="file" accept=".json,application/json"></label>
      <div id="importar-resultado" class="suave" role="status"></div></div>`;

  $('#config-salvar-nome', el).addEventListener('click', async () => {
    const nome = $('#config-nome', el).value.trim();
    if (!nome) { avisar('Informe um nome.', 'erro'); return; }
    if (await tentar(() => store.update('profiles', state.user.id, { name: nome }))) {
      $('#cabecalho-usuario').textContent = primeiroNome(nome);
      avisar('Nome salvo'); router.go('config');
    }
  });

  $('#exportar-json', el).addEventListener('click', () => tentar(async () => {
    const tabelas = {};
    for (const t of TABELAS_BACKUP) {
      const linhas = await store.list(t);
      tabelas[t] = t === 'tags' ? linhas : t === 'profiles' ? linhas.filter((p) => p.id === state.user.id) : filtrarDono(linhas);
    }
    baixarArquivo(`financas-${todayISO()}.json`,
      JSON.stringify({ app: 'controle-financas-pessoais', versao: 1, exportado_em: new Date().toISOString(), tabelas }, null, 2), 'application/json');
  }));

  $('#exportar-csv', el).addEventListener('click', () => tentar(async () => {
    const txs = filtrarDono(await store.list('transactions')).sort((a, b) => a.competence_date.localeCompare(b.competence_date));
    const linhas = ['data;competencia;pessoa;tipo;valor;descricao;tag;pagamento'];
    for (const t of txs) {
      linhas.push([formatDateBR(t.purchase_date), formatDateBR(t.competence_date), nomePessoa(t.owner_id),
        TIPOS[t.kind], (t.amount_cents / 100).toFixed(2).replace('.', ','), t.description,
        t.tag_id ? tagNome(t.tag_id) : '', t.payment ? PAGAMENTOS[t.payment] : ''].map(campoCSV).join(';'));
    }
    baixarArquivo(`lancamentos-${todayISO()}.csv`, '﻿' + linhas.join('\n') + '\n', 'text/csv;charset=utf-8');
  }));

  $('#importar-json', el).addEventListener('change', async (ev) => {
    const arquivo = ev.target.files[0];
    const saida = $('#importar-resultado', el);
    if (!arquivo) return;
    saida.textContent = 'Importando…';
    try {
      const dados = JSON.parse(await arquivo.text());
      if (!dados || dados.app !== 'controle-financas-pessoais' || !dados.tabelas) throw new Error('formato');
      const r = await importarBackup(dados.tabelas);
      saida.textContent = `${r.lanc} ${r.lanc === 1 ? 'lançamento importado' : 'lançamentos importados'}, ${r.jaExistiam} já existiam` +
        (r.outros ? ` (e ${r.outros} outros registros restaurados).` : '.');
      await carregarBase();
    } catch (e) {
      saida.textContent = e.message === 'formato' || e instanceof SyntaxError
        ? 'Arquivo inválido: use um backup JSON exportado por este app.' : e.message;
    }
    ev.target.value = '';
  });

  await montarLembrete(el);
};

// ---------- Configurações → Lembrete diário e frases ----------
// Tudo salva sozinho ao mudar. A notificação é enviada pela Edge Function "lembrete-diario" (ver supabase/functions).
const DIAS_SEMANA = [[1, 'Seg'], [2, 'Ter'], [3, 'Qua'], [4, 'Qui'], [5, 'Sex'], [6, 'Sáb'], [7, 'Dom']];
const CAMPOS_LEMBRETE = Object.keys(LEMBRETE_PADRAO);

async function montarLembrete(el) {
  const L = { cfg: { ...LEMBRETE_PADRAO }, frases: [], inscricoes: [], sub: null, editando: null };
  const cartao = $('#lembrete-cartao', el);
  try {
    const [cfgs, frases, inscricoes, sub] = await Promise.all([
      store.list('lembrete_config'), store.list('frases'), store.list('push_inscricoes'),
      pushAparelho.suportado() ? pushAparelho.inscricaoAtual().catch(() => null) : null]);
    const meu = cfgs.find((c) => c.owner_id === state.user.id);
    if (meu) for (const k of CAMPOS_LEMBRETE) if (meu[k] != null) L.cfg[k] = meu[k];
    L.cfg.hora = String(L.cfg.hora).slice(0, 5);
    L.frases = frases;
    L.inscricoes = filtrarDono(inscricoes);
    L.sub = sub;
  } catch (e) {
    cartao.innerHTML = `<h2>Lembrete diário</h2><p class="erro">${esc(e.message)}</p>`;
    $('#frases-cartao', el).hidden = true;
    return;
  }

  const status = (texto, erro) => { const s = $('#lembrete-status', el); s.textContent = texto; s.className = erro ? 'erro' : 'suave'; };
  async function salvar(campos) {
    const novo = { ...L.cfg, ...campos };
    if (!novo.dias.length) { status('Escolha pelo menos um dia.', true); return false; }
    if (!String(novo.titulo).trim()) { status('O título não pode ficar vazio.', true); return false; }
    const linha = { owner_id: state.user.id };
    for (const k of CAMPOS_LEMBRETE) linha[k] = novo[k];
    try { await store.upsert('lembrete_config', linha); } catch (e) { status(e.message, true); return false; }
    L.cfg = novo;
    status('Salvo ✓');
    desenharPrevia();
    return true;
  }

  cartao.innerHTML = `<h2>Lembrete diário</h2>
    <p class="suave" style="margin-top:0">Uma notificação por dia para lembrar de lançar os gastos, com uma frase sobre dinheiro. Cada conta tem a própria configuração.</p>

    <label class="campo"><span>Mensagem</span><textarea id="lembrete-mensagem" maxlength="200" rows="2"></textarea></label>
    <div class="campo"><span>Como vai aparecer (a frase muda a cada dia)</span><div id="lembrete-previa"></div></div>

      <h3 style="margin:16px 0 0">Minhas frases</h3>
      <div id="minhas-frases">${minhas.map(linhaMinha).join('') || '<p class="suave">Nenhuma frase sua ainda.</p>'}</div>
      <label class="campo"><span>Nova frase</span><textarea id="frase-nova-texto" maxlength="280" rows="2" placeholder="Ex.: Pague-se primeiro."></textarea></label>
      <label class="campo"><span>Autor (opcional)</span><input id="frase-nova-autor" maxlength="60"></label>
      <div class="erro" id="frase-erro" role="alert"></div>
      <div class="chips" style="margin-top:8px"><button class="btn" id="frase-adicionar"><i class="ti ti-plus"></i>Adicionar frase</button></div>
      <details style="margin-top:12px"><summary>Ver as ${prontas.length} frases prontas</summary>
        <ul class="lista-prontas">${prontas.map((f) => `<li>“${esc(f.texto)}” <span class="suave">— ${esc(f.autor)}</span></li>`).join('')}</ul></details>`;

      if (await salvar({ autores_desligados: off })) desenharFrases();

    $('#frase-adicionar', fc).addEventListener('click', async () => {
      const texto = $('#frase-nova-texto', fc).value.trim();
      const autor = $('#frase-nova-autor', fc).value.trim();
      if (!texto) { $('#frase-erro', fc).textContent = 'Escreva a frase antes de adicionar.'; return; }
      const [nova] = (await tentar(() => store.insert('frases', { owner_id: state.user.id, texto, autor }))) || [];
      if (nova) { L.frases.push(nova); desenharFrases(); desenharPrevia(); }
    });
    $$('#minhas-frases .frase-editar', fc).forEach((b) => b.addEventListener('click', () => { L.editando = b.closest('[data-id]').dataset.id; desenharFrases(); }));
    $$('#minhas-frases .frase-excluir', fc).forEach((b) => b.addEventListener('click', async () => {
      const id = b.closest('[data-id]').dataset.id;
      if (await tentar(async () => { await store.remove('frases', id); return true; })) {
        L.frases = L.frases.filter((f) => f.id !== id); desenharFrases(); desenharPrevia();
      }
    }));
    const salvarEd = $('#frase-edit-salvar', fc);
    if (salvarEd) {
      salvarEd.addEventListener('click', async () => {
        const texto = $('#frase-edit-texto', fc).value.trim();
        const autor = $('#frase-edit-autor', fc).value.trim();
        if (!texto) { $('#frase-erro', fc).textContent = 'A frase não pode ficar vazia.'; return; }
        const nova = await tentar(() => store.update('frases', L.editando, { texto, autor }));
        if (nova) { L.frases = L.frases.map((f) => (f.id === nova.id ? nova : f)); L.editando = null; desenharFrases(); desenharPrevia(); }
      });
      $('#frase-edit-cancelar', fc).addEventListener('click', () => { L.editando = null; desenharFrases(); });
    }
  }

  desenharAparelho();
  desenharPrevia();
  desenharFrases();
}

// Reinsere só o que falta: as tags e os registros da própria pessoa (backup antigo sem dono nas tags também serve).
async function importarBackup(tabelas) {
  const r = { lanc: 0, jaExistiam: 0, outros: 0 };
  const ordem = ['tags', 'recurrences', 'goals', 'transactions', 'goal_deposits', 'budgets'];
  for (const t of ordem) {
    const vindas = Array.isArray(tabelas[t]) ? tabelas[t] : [];
    const existentes = new Set((await store.list(t)).map((x) => x.id));
    let faltam = vindas.filter((x) => !existentes.has(x.id) && (t === 'tags' ? (!x.owner_id || x.owner_id === state.user.id) : x.owner_id === state.user.id));
    if (t === 'tags') faltam = faltam.sort((a, b) => (a.parent_id ? 1 : 0) - (b.parent_id ? 1 : 0)); // mães antes
    if (t === 'transactions') r.jaExistiam += vindas.filter((x) => existentes.has(x.id) && x.owner_id === state.user.id).length;
    for (const linha of faltam) {
      const copia = { ...linha };
      if (t === 'tags') { delete copia.created_by; delete copia.owner_id; }
      delete copia.competence_month; // coluna calculada pelo banco
      await store.insert(t, copia);
      if (t === 'transactions') r.lanc++; else r.outros++;
    }
  }
  return r;
}

}

// ---------- login e menu ----------
function mostrarLogin() {
  $('#app').hidden = true;
  $('#tela-login').hidden = false;
  $('#login-erro').textContent = '';
  $('#login-senha').value = '';
}
async function entrouNoApp(user) {
  state.user = user;
  $('#tela-login').hidden = true;
  $('#app').hidden = false;
  await tentar(carregarBase);
  const eu = state.people.find((p) => p.id === user.id);
  $('#cabecalho-usuario').textContent = eu ? primeiroNome(eu.name) : '';
  hojeMes();
  await router.go('mes');
}
function ligarCasca() {
  $('#login-form').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const email = $('#login-email').value.trim(), senha = $('#login-senha').value;
    if (!email || !senha) { $('#login-erro').textContent = 'Preencha e-mail e senha.'; return; }
    $('#login-entrar').disabled = true;
    try { await entrouNoApp(await store.signIn(email, senha)); }
    catch (e) { $('#login-erro').textContent = e.message; }
    finally { $('#login-entrar').disabled = false; }
  });
  aplicarOcultar(lerOcultar());
  $('#olho').addEventListener('click', () => {
    const ligar = !document.body.classList.contains('ocultar-valores');
    aplicarOcultar(ligar);
    try { localStorage.setItem('ocultar-valores', ligar ? '1' : '0'); } catch (e) { /* ignora */ }
  });
  $('#menu-botao').addEventListener('click', () => {
    const menu = $('#menu');
    menu.hidden = !menu.hidden;
    $('#menu-botao').setAttribute('aria-expanded', String(!menu.hidden));
  });
  $$('#menu [data-tela]').forEach((b) => b.addEventListener('click', () => router.go(b.dataset.tela)));
  $('#menu-sair').addEventListener('click', async () => { $('#menu').hidden = true; await store.signOut(); state.user = null; mostrarLogin(); });
  $('#modal-fundo').addEventListener('click', (ev) => { if (ev.target.id === 'modal-fundo') fecharModal(); });
  document.addEventListener('keydown', (ev) => {
    if (ev.key !== 'Escape' || $('#modal-fundo').hidden) return;
    // Com o painel de nova tag aberto, o Esc só volta ao lançamento.
    if ($('#nova-tag-inline')) { $('#nt-cancelar').click(); return; }
    fecharModal();
  });
  $('#novo-lancamento').addEventListener('click', () => abrirLancamento());
}
/* === FIM 5 === */

/* === 6 GRAFICOS === */
// Desenho dos gráficos com Chart.js, na paleta do app. Valores recebidos em reais.
const graficos = {};
const BRL_INTEIRO = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0 });
function reais(cents) { return Math.round(cents) / 100; }

function desenharGrafico(canvasId, tipo, labels, datasets, opcoes = {}) {
  const canvas = document.getElementById(canvasId);
  if (!canvas || !window.Chart) return;
  if (graficos[canvasId]) graficos[canvasId].destroy();
  const horizontal = opcoes.horizontal;
  const valores = datasets.flatMap((d) => d.data).filter((v) => typeof v === 'number');
  const esc_ = escalaEixo(Math.max(0, ...valores));
  const temNegativo = valores.some((v) => v < 0);
  const eixoValor = {
    min: temNegativo ? undefined : 0, max: esc_.max, beginAtZero: true,
    ticks: { color: '#7A5C46', stepSize: esc_.step, callback: (v) => BRL_INTEIRO.format(v) },
  };
  graficos[canvasId] = new Chart(canvas, {
    type: tipo,
    data: { labels, datasets },
    options: {
      responsive: true, maintainAspectRatio: false, indexAxis: horizontal ? 'y' : 'x',
      plugins: {
        legend: { display: datasets.length > 1 || tipo === 'doughnut', position: tipo === 'doughnut' ? 'right' : 'top', labels: { color: '#3B2416', boxWidth: 12, font: { family: 'Inter' } } },
        tooltip: { callbacks: { label: (c) => {
          const v = typeof c.parsed === 'number' ? c.parsed : c.parsed[horizontal ? 'x' : 'y'];
          const nome = tipo === 'doughnut' ? c.label : c.dataset.label;
          return `${nome ? nome + ': ' : ''}${formatBRL(Math.round(v * 100))}`;
        } } },
      },
      scales: tipo === 'doughnut' ? {} : horizontal ? {
        x: { grid: { color: '#E8D3B9' }, ...eixoValor },
        y: { grid: { color: 'transparent' }, ticks: { color: '#7A5C46' } },
      } : {
        x: { grid: { color: 'transparent' }, ticks: { color: '#7A5C46' } },
        y: { grid: { color: '#E8D3B9' }, ...eixoValor },
      },
      onClick: opcoes.onClick,
    },
  });
}
/* === FIM 6 === */

/* === 7 INICIALIZACAO === */
// window.__TEST_STORE__ só existe nos testes automáticos (banco em memória).
const store = window.__TEST_STORE__ ||
  createStore(window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY));

// Notificações deste aparelho (Web Push). Nos testes, window.__TEST_PUSH__ simula o navegador.
const pushAparelho = window.__TEST_PUSH__ || {
  suportado: () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window,
  precisaInstalar: () => precisaInstalarNoIphone(navigator.userAgent,
    window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true),
  permissao: () => ('Notification' in window ? Notification.permission : 'denied'),
  async inscricaoAtual() {
    const reg = await navigator.serviceWorker.getRegistration();
    const sub = reg && await reg.pushManager.getSubscription();
    return sub ? sub.toJSON() : null;
  },
  async inscrever(chave) {
    const permissao = await Notification.requestPermission();
    if (permissao !== 'granted') { const e = new Error('negado'); e.code = 'negado'; throw e; }
    const reg = await navigator.serviceWorker.ready;
    const antiga = await reg.pushManager.getSubscription();
    if (antiga) await antiga.unsubscribe(); // a chave pode ter mudado
    return (await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: chave })).toJSON();
  },
  async cancelar() {
    const reg = await navigator.serviceWorker.getRegistration();
    const sub = reg && await reg.pushManager.getSubscription();
    if (sub) await sub.unsubscribe();
  },
  nomeAparelho() {
    const ua = navigator.userAgent;
    return /iPhone/.test(ua) ? 'iPhone' : /iPad/.test(ua) ? 'iPad' : /Android/.test(ua) ? 'Android'
      : /Windows/.test(ua) ? 'Windows' : /Mac/.test(ua) ? 'Mac' : 'Outro';
  },
};

// App instalável: registra o service worker (fora dos testes automáticos).
if ('serviceWorker' in navigator && location.protocol.startsWith('http') && !window.__TEST_STORE__) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}

(async function iniciar() {
  ligarCasca();
  const user = await tentar(() => store.restoreSession());
  if (user) await entrouNoApp(user); else mostrarLogin();
  store.onAuthChange((u) => { if (!u && state.user) { state.user = null; mostrarLogin(); } });
})();
/* === FIM 7 === */
